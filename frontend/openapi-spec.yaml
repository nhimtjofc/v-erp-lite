        variantId:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: integer
          format: int32
    Business:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        taxId:
          type: string
        logoUrl:
          type: string
        active:
          type: boolean
    Cart:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        customer:
          $ref: '#/components/schemas/Customer'
        subtotalAmountMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        cart:
          $ref: '#/components/schemas/Cart'
        product:
          $ref: '#/components/schemas/Product'
        variant:
          $ref: '#/components/schemas/ProductVariant'
        quantity:
          type: integer
          format: int32
        unitPriceMinor:
          type: integer
          format: int64
        subtotalAmountMinor:
          type: integer
          format: int64
        currency:
          type: string
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
    CartItem1:
      type: object
      properties:
        productId:
          $ref: '#/components/schemas/UUID'
        productVariantId:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: integer
          format: int32
    Category:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: string
        parent:
          $ref: '#/components/schemas/Category'
        active:
          type: boolean
    CheckoutRequest:
      type: object
      properties:
        discountPercent:
          type: number
        vatPercent:
          type: number
        shippingFeeMinor:
          type: integer
          format: int64
        notes:
          type: string
    CheckoutRequest1:
      type: object
      properties:
        customerId:
          $ref: '#/components/schemas/UUID'
        voucherCode:
          type: string
        shippingName:
          type: string
        shippingPhone:
          type: string
        shippingAddress:
          type: string
        shippingNote:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem1'
    ConfigRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: {}
    CreateIntentRequest:
      type: object
      properties:
        orderId:
