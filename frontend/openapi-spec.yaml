      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        business:
          $ref: '#/components/schemas/Business'
        customer:
          $ref: '#/components/schemas/Customer'
        voucher:
          $ref: '#/components/schemas/Voucher'
        orderNumber:
          type: string
        orderDate:
          $ref: '#/components/schemas/Instant'
        status:
          type: string
        shippingName:
          type: string
        shippingPhone:
          type: string
        shippingAddress:
          type: string
        shippingNote:
          type: string
        subtotalAmountMinor:
          type: integer
          format: int64
        discountAmountMinor:
          type: integer
          format: int64
        discountPercent:
          type: number
        shippingFeeMinor:
          type: integer
          format: int64
        taxAmountMinor:
          type: integer
          format: int64
        vatPercent:
          type: number
        vatAmountMinor:
