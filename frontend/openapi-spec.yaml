          format: int64
        finalAmountMinor:
          type: integer
          format: int64
        currency:
          type: string
        notes:
          type: string
        deletedAt:
          $ref: '#/components/schemas/Instant'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderHistory:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        order:
          $ref: '#/components/schemas/Order'
        tenantId:
          type: string
        oldStatus:
          type: string
        newStatus:
          type: string
        note:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
    OrderItem:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        order:
          $ref: '#/components/schemas/Order'
        product:
          $ref: '#/components/schemas/Product'
        productVariant:
          $ref: '#/components/schemas/ProductVariant'
        quantity:
          type: integer
          format: int32
        unitPriceMinor:
          type: integer
          format: int64
        subtotalAmountMinor:
          type: integer
          format: int64
        currency:
          type: string
    OrderUpdateRequest:
      type: object
      properties:
        notes:
          type: string
        shippingFeeMinor:
          type: integer
          format: int64
        discountPercent:
          type: number
        vatPercent:
          type: number
    PasswordChangeRequest:
      type: object
      properties:
        newPassword:
          type: string
    PaymentIntent:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        orderId:
          $ref: '#/components/schemas/UUID'
        customerId:
          $ref: '#/components/schemas/UUID'
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        idempotencyKey:
          type: string
        expiresAt:
          $ref: '#/components/schemas/Instant'
    PaymentTransaction:
      type: object
      properties:
        tenantId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        createdBy:
          $ref: '#/components/schemas/UUID'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        updatedBy:
          $ref: '#/components/schemas/UUID'
        version:
          type: integer
          format: int64
        id:
          $ref: '#/components/schemas/UUID'
        paymentIntent:
          $ref: '#/components/schemas/PaymentIntent'
        gateway:
