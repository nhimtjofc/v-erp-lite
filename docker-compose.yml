services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: v-erp-lite
      POSTGRES_USER: v-erp
      POSTGRES_PASSWORD: v-erp-secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v-erp -d v-erp-lite"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8181
      KC_FEATURES: organization
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/v-erp-lite
      KC_DB_USERNAME: v-erp
      KC_DB_PASSWORD: v-erp-secret
    ports:
      - "8181:8181"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

volumes:
  pgdata:
