services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: v-erp-lite
      MARIADB_USER: v-erp
      MARIADB_PASSWORD: v-erp-secret
      MARIADB_ROOT_PASSWORD: root-secret
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot-secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8181
      KC_FEATURES: organization
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/v-erp-lite
      KC_DB_USERNAME: v-erp
      KC_DB_PASSWORD: v-erp-secret
    ports:
      - "8181:8181"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress-local-only}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-wordpress-root-local-only}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - wordpressdbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  wordpress:
    image: wordpress:7.0.0-php8.3-apache
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress-local-only}
      V_ERP_API_BASE_URL: ${V_ERP_API_BASE_URL:-http://host.docker.internal:8081/api}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRETS_LOCAL:-}
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpressdata:/var/www/html
      - ./docker/wordpress/wp-content/plugins:/var/www/html/wp-content/plugins
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); if (!$$socket) { exit(1); } fclose($$socket);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wordpress-setup:
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33"
    depends_on:
      wordpress-db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress-local-only}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost:8090}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE:-V-ERP WooCommerce}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-password}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@v-erp.local}
      WOOCOMMERCE_VERSION: "10.9.4"
      V_ERP_API_BASE_URL: ${V_ERP_API_BASE_URL:-http://host.docker.internal:8081/api}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRETS_LOCAL:-}
      WORDPRESS_SETUP_MAX_ATTEMPTS: ${WORDPRESS_SETUP_MAX_ATTEMPTS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpressdata:/var/www/html
      - ./docker/wordpress/wp-content/plugins:/var/www/html/wp-content/plugins
      - ./docker/wordpress/setup.sh:/opt/v-erp/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/v-erp/setup.sh"]
    restart: "no"

volumes:
  mariadbdata:
  wordpressdbdata:
  wordpressdata:
