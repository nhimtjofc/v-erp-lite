services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: v-erp-lite
      MARIADB_USER: v-erp
      MARIADB_PASSWORD: v-erp-secret
      MARIADB_ROOT_PASSWORD: root-secret
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot-secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8181
      KC_FEATURES: organization
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/v-erp-lite
      KC_DB_USERNAME: v-erp
      KC_DB_PASSWORD: v-erp-secret
    ports:
      - "8181:8181"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

volumes:
  mariadbdata:
