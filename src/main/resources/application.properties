# HTTP
quarkus.http.root-path=/api/
quarkus.http.host=0.0.0.0
quarkus.http.port=8081
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=HEAD, GET, POST, PUT, PATCH, DELETE, OPTIONS

quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.limits.max-body-size=10M

# Hibernate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true

# MariaDB (docker-compose)
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3307/v-erp-lite
quarkus.datasource.db-kind=mariadb
quarkus.datasource.db-version=11.4
quarkus.datasource.username=v-erp
quarkus.datasource.password=v-erp-secret
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.additional-jdbc-properties.sessionVariables=sql_mode='STRICT_ALL_TABLES\,NO_ZERO_DATE\,NO_ZERO_IN_DATE\,ERROR_FOR_DIVISION_BY_ZERO\,NO_ENGINE_SUBSTITUTION'

# Flyway
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
%dev.quarkus.flyway.repair-at-start=true
%dev.quarkus.flyway.out-of-order=true
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3307/v-erp-lite-test
%test.quarkus.datasource.username=v-erp
%test.quarkus.datasource.password=v-erp-secret
%test.quarkus.flyway.clean-at-start=true
%test.payment.tenant.default=acme
%test.ledger.invariants.cron=off
%test.payment.inbox.cron=off
%test.payment.provider.localstripe.enabled=true
%test.payment.provider.localstripe.webhook-secret=whsec_test

# Multi-tenant: Quarkus 3.x does not support DISCRIMINATOR;
# tenant_id column is still on entities for manual filtering.
quarkus.hibernate-orm.multitenant=NONE

# JSON column support: use Hibernate's built-in serializer, not the app ObjectMapper
quarkus.hibernate-orm.mapping.format.global=ignore

# Keycloak OIDC — bearer token validation (docker-compose on :8181)
quarkus.oidc.auth-server-url=http://localhost:8181/realms/v-erp-lite
quarkus.oidc.client-id=v-erp-app
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.tenant-enabled=true

# Keycloak Admin Client (docker-compose on :8181)
quarkus.keycloak.admin-client.server-url=http://localhost:8181
quarkus.keycloak.admin-client.realm=v-erp-lite
quarkus.keycloak.admin-client.client-id=v-erp-admin
quarkus.keycloak.admin-client.client-secret=v-erp-admin-secret
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# OpenAPI
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
mp.openapi.extensions.smallrye.openapi=3.1.1
quarkus.smallrye-openapi.always-run-filter=true

# Misc
quarkus.arc.fail-on-intercepted-private-method=false
%dev.quarkus.datasource.dev-ui.allow-sql=true

# Ecommerce integration. Each channel resolves its HMAC secret server-side from
# WOOCOMMERCE_WEBHOOK_SECRETS_<REFERENCE>; there is no global fallback.
# Never add an actual secret value to this file.
ecommerce.health.timeout=PT3S
ecommerce.health.allow-private-hosts=false
%dev.ecommerce.health.allow-private-hosts=true
%dev.ecommerce.bootstrap.enabled=true
%dev.ecommerce.bootstrap.tenant-id=v-erp-app
%dev.ecommerce.bootstrap.business-id=b1000000-0000-0000-0000-000000000001
%dev.ecommerce.bootstrap.store-url=http://localhost:8090
%dev.ecommerce.bootstrap.secret-reference=local

# Chatbot Integration

# Order owner response SLA and scan cadence.
orders.owner-decision-sla=PT24H
orders.owner-decision-scan-interval=PT5M

# Automated vendor payouts. Monetary values are stored in currency minor units.
payout.schedule.interval=PT24H
payout.schedule.initial-delay=PT1M
payout.minimum-threshold-minor=100000
payout.review-threshold-minor=50000000
payout.risk-window=P90D
payout.balance-spike-multiplier=3.0
payout.bank-transfer.mode=mock
